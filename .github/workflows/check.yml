name: Check translation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check limits and characters
        run: python3 tools/check_en.py translation

      - name: Check that only the words changed
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/check_en.py translation --base-ref "origin/${{ github.base_ref }}"
